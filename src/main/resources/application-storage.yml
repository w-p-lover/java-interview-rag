spring:
  config:
    activate:
      on-profile: storage
    import:
      - optional:file:D:/IdeaProjects/blog/blog-springboot/.env[.properties]
  autoconfigure:
    exclude:
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeImageAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioSpeechAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioTranscriptionAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeRerankAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${JAVA_INTERVIEW_RAG_DB_URL:jdbc:mysql://${BLOG_DB_HOST:127.0.0.1}:${BLOG_DB_PORT:3306}/java_interview_rag?serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&useSSL=false&useUnicode=true&characterEncoding=UTF-8&connectTimeout=5000&socketTimeout=15000&tcpKeepAlive=true}
    username: ${JAVA_INTERVIEW_RAG_DB_USERNAME:${BLOG_DB_USERNAME:java_interview_rag}}
    password: ${JAVA_INTERVIEW_RAG_DB_PASSWORD:${BLOG_DB_PASSWORD:}}
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 8
      max-wait: 10000
      validation-query: SELECT 1
      validation-query-timeout: 3
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  ai:
    model:
      chat: openai
    dashscope:
      api-key: ${JAVA_INTERVIEW_RAG_DASHSCOPE_API_KEY:${BLOG_DASHSCOPE_API_KEY:}}
      embedding:
        options:
          model: ${JAVA_INTERVIEW_RAG_DASHSCOPE_EMBED_MODEL:${BLOG_DASHSCOPE_EMBED_MODEL:text-embedding-v3}}
    openai:
      base-url: ${JAVA_INTERVIEW_RAG_DASHSCOPE_COMPATIBLE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      api-key: ${JAVA_INTERVIEW_RAG_DASHSCOPE_API_KEY:${BLOG_DASHSCOPE_API_KEY:}}
      chat:
        options:
          model: ${JAVA_INTERVIEW_RAG_DASHSCOPE_CHAT_MODEL:qwen3.7-plus}
          temperature: 0.2
    vectorstore:
      qdrant:
        host: ${JAVA_INTERVIEW_RAG_QDRANT_HOST:${BLOG_QDRANT_HOST:127.0.0.1}}
        port: ${JAVA_INTERVIEW_RAG_QDRANT_PORT:${BLOG_QDRANT_PORT:6334}}
        collection-name: ${JAVA_INTERVIEW_RAG_QDRANT_COLLECTION:java-interview-rag-chunks}
        initialize-schema: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
