spring:
  application:
    name: java-interview-rag
  profiles:
    default: local
  ai:
    model:
      chat: none
    chat:
      observations:
        log-prompt: false
        log-completion: false
    vectorstore:
      observations:
        log-query-response: false
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeMultimodalEmbeddingAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeVideoAutoConfiguration
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:./config/application-private.yml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      file-size-threshold: 10MB

server:
  port: 18080

java-interview-rag:
  files:
    backend: ${JAVA_INTERVIEW_RAG_FILES_BACKEND:local}
    local-root: ${JAVA_INTERVIEW_RAG_FILES_LOCAL_ROOT:.tmp/file-objects}
    s3:
      endpoint: ${JAVA_INTERVIEW_RAG_S3_ENDPOINT:}
      bucket: ${JAVA_INTERVIEW_RAG_S3_BUCKET:java-interview-rag}
      region: ${JAVA_INTERVIEW_RAG_S3_REGION:us-east-1}
      access-key: ${JAVA_INTERVIEW_RAG_S3_ACCESS_KEY:}
      secret-key: ${JAVA_INTERVIEW_RAG_S3_SECRET_KEY:}
      auto-create-bucket: ${JAVA_INTERVIEW_RAG_S3_AUTO_CREATE_BUCKET:true}
  retrieval:
    timeout: ${JAVA_INTERVIEW_RAG_RETRIEVAL_TIMEOUT:5s}
  answer:
    timeout: ${JAVA_INTERVIEW_RAG_ANSWER_TIMEOUT:60s}
    context-token-budget: ${JAVA_INTERVIEW_RAG_ANSWER_CONTEXT_TOKEN_BUDGET:6000}
    response-token-reserve: ${JAVA_INTERVIEW_RAG_ANSWER_RESPONSE_TOKEN_RESERVE:1200}
  knowledge:
    chunk:
      max-tokens: ${JAVA_INTERVIEW_RAG_CHUNK_MAX_TOKENS:600}
  index:
    embedding-model: ${JAVA_INTERVIEW_RAG_EMBEDDING_MODEL:text-embedding-v3}
    embedding-dimensions: ${JAVA_INTERVIEW_RAG_EMBEDDING_DIMENSIONS:1024}
    chunk-policy-version: ${JAVA_INTERVIEW_RAG_CHUNK_POLICY_VERSION:markdown-section-chunker-v5}
    parser-version: ${JAVA_INTERVIEW_RAG_PARSER_VERSION:pdf-knowledge-parser-v6}
    schema-version: ${JAVA_INTERVIEW_RAG_INDEX_SCHEMA_VERSION:knowledge-index-v2}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  observations:
    key-values:
      application: java-interview-rag
  metrics:
    tags:
      application: java-interview-rag
